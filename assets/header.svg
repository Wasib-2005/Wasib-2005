<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="WASIB" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00f0ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="898" height="238" rx="10"/></clipPath>
    <clipPath id="typed">
      <rect x="40" y="26" width="0" height="34">
        <animate attributeName="width" calcMode="discrete" values="0;12;24;36;48;60;72;84;96" dur="0.9s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="240" rx="10" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="238" rx="10" fill="none" stroke="#00f0ff" stroke-opacity=".35" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- prompt -->
  <text x="40" y="52" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="20" fill="#00f0ff" clip-path="url(#typed)">$ whoami</text>
  <rect x="140" y="34" width="10" height="20" fill="#00f0ff">
    <animate attributeName="opacity" values="1;0;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- name: flickers on letter by letter, then glitches now and then -->
  <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="104" font-weight="800">
    <g id="cy" fill="#00f0ff" opacity="0">
      <text x="40"  y="165">W</text><text x="114" y="165">A</text><text x="188" y="165">S</text><text x="262" y="165">I</text><text x="336" y="165">B</text>
      <animate attributeName="opacity" values="0;0;.75;.75;0;0" keyTimes="0;.89;.9;.98;.99;1" dur="5s" begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 -1;-4 1;0 0;0 0" keyTimes="0;.89;.92;.96;.99;1" dur="5s" begin="3s" repeatCount="indefinite"/>
    </g>
    <g fill="#ffffff">
      <text x="40" y="165" opacity="0">W<animate attributeName="opacity" values="0;1;.2;1;.55;1" keyTimes="0;.15;.3;.5;.7;1" dur=".7s" begin="1.5s" fill="freeze"/></text>
      <text x="114" y="165" opacity="0">A<animate attributeName="opacity" values="0;1;.2;1;.55;1" keyTimes="0;.15;.3;.5;.7;1" dur=".7s" begin="1.65s" fill="freeze"/></text>
      <text x="188" y="165" opacity="0">S<animate attributeName="opacity" values="0;1;.2;1;.55;1" keyTimes="0;.15;.3;.5;.7;1" dur=".7s" begin="1.8s" fill="freeze"/></text>
      <text x="262" y="165" opacity="0">I<animate attributeName="opacity" values="0;1;.2;1;.55;1" keyTimes="0;.15;.3;.5;.7;1" dur=".7s" begin="1.95s" fill="freeze"/></text>
      <text x="336" y="165" opacity="0">B<animate attributeName="opacity" values="0;1;.2;1;.55;1" keyTimes="0;.15;.3;.5;.7;1" dur=".7s" begin="2.1s" fill="freeze"/></text>
    </g>
  </g>

  <text x="40" y="208" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="16" fill="#8b949e" opacity="0">wasibul islam wasib &#183; full-stack developer &#183; mern
    <animate attributeName="opacity" from="0" to="1" dur=".8s" begin="3s" fill="freeze"/>
  </text>

  <!-- scanline -->
  <g clip-path="url(#card)">
    <rect x="0" y="-60" width="900" height="60" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 300" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>